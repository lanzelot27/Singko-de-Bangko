server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Enable service discovery-based routing via Eureka
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # -------------------------------------------------------
        # AUTH SERVICE — public route (no JWT required)
        # POST /api/auth/login  →  auth-service
        # -------------------------------------------------------
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        # -------------------------------------------------------
        # ACCOUNT SERVICE — protected route
        # GET /api/accounts/**  →  account-service
        # -------------------------------------------------------
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
          filters:
            - StripPrefix=1

        # -------------------------------------------------------
        # TRANSACTION SERVICE — protected route
        # POST /api/transactions/**  →  transaction-service
        # -------------------------------------------------------
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
          filters:
            - StripPrefix=1

# Eureka client config
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
